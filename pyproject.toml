[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "website-health-monitor"
version = "0.2.0"
description = "A self-hosted website health monitor with a FastAPI dashboard and SQLite history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "deathtoconding" }]
keywords = [
  "monitoring",
  "uptime",
  "website",
  "fastapi",
  "sqlite",
  "self-hosted",
  "observability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  # Test tooling. Starlette's TestClient prefers httpx2 and deprecates httpx for tests,
  # while the runtime check/dispatch code deliberately keeps using httpx.
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=6.3,<8.0",
  "httpx2>=2.13,<3.0",
  # Formatter and linter versions are bounded on purpose: a new style release must be
  # adopted deliberately instead of silently reformatting the repository inside CI.
  "ruff>=0.16.10,<0.17",
  "pre-commit>=4.6,<5.0",
]

[project.scripts]
whm-backup = "app.backup:main"

[project.urls]
Homepage = "https://github.com/deathtoconding/website-health-monitor"
Repository = "https://github.com/deathtoconding/website-health-monitor"
Issues = "https://github.com/deathtoconding/website-health-monitor/issues"
Changelog = "https://github.com/deathtoconding/website-health-monitor/blob/main/CHANGELOG.md"
Security = "https://github.com/deathtoconding/website-health-monitor/security/policy"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
