name: Bug report
description: Something is incorrect, crashing, or behaving differently than documented
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include secrets, webhook URLs, private
        hostnames, or database contents.** For security vulnerabilities, use the
        private reporting channel described in SECURITY.md instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences describing the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Reference the documented behavior if you can (README, docs/architecture.md, or docs/runbook.md).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `make run`
        2. Add a website with ...
        3. Run a manual check
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Health state and evidence
      description: |
        If the report is about a health classification or an incident, paste the
        reason code and the affected checks from the dashboard or
        `GET /api/websites/{id}` (sanitized).
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: UTC log lines around the problem. Remove secrets, tokens, and private hostnames.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Application version
      description: Value from `GET /api/health`, `/healthz`, or `git describe --tags`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it
      options:
        - "make run / python -m app (local)"
        - systemd unit from deploy/
        - Behind a reverse proxy or VPN
        - Other (explain in the summary)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/distribution, Python version, SQLite schema version from `/api/health`.
      placeholder: "Ubuntu 24.04, Python 3.12.3, schema 1"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I ran `make check` on my checkout and it passes (for source-level reports).
        - label: I searched existing issues for the same problem.
        - label: This report contains no secrets or private hostnames.
      validations:
        required: true
