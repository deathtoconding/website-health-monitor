name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run for the same ref instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Report environment versions
        # Makes an unexplained failure (for example formatter drift) diagnosable
        # from the log alone.
        run: |
          python -VV
          python -m pip --version
          ruff --version
          python -m pytest --version
      - name: Run lint, metadata verification, and tests (90% coverage gate)
        run: make check
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Build wheel and verify dashboard assets are packaged
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/whm-wheel" .
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheel_dir = Path(os.environ["RUNNER_TEMP"]) / "whm-wheel"
          wheel = next(wheel_dir.glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "app/static/index.html",
              "app/static/app.css",
              "app/static/app.js",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing dashboard assets: {sorted(missing)}")
          print(f"verified dashboard assets in {wheel.name}")
          PY
      - name: Check dependency consistency
        run: python -m pip check
