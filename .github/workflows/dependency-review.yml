name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Review dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          # Fail the check on high/critical advisories introduced by the pull request.
          fail-on-severity: high
          # Summarize findings on the pull request when the check fails.
          comment-summary-in-pr: on-failure
