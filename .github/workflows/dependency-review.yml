name: Dependency review

# Reviews dependency changes introduced by a pull request for known advisories.
#
# Requirement: this workflow needs the repository's **Dependency graph** to be
# enabled (Settings → Code security and analysis → Dependency graph / Dependabot
# alerts). When that setting is off, the action reports
# "Dependency review is not supported on this repository"; the step is marked
# continue-on-error so an unrelated pull request is never blocked by repository
# configuration. Turn the setting on to get real findings — and see the
# "Repository security settings" section of SECURITY.md.
#
# Note: GitHub's dependency-review action understands pip dependency manifests
# (such as requirements files or lockfiles). This project declares ranges in
# pyproject.toml, so Dependabot alerting is the primary dependency signal and
# this job complements it once the manifests are analyzable.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Review dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          # Fail on high/critical advisories introduced by the pull request.
          fail-on-severity: high
          # Summarize findings on the pull request when the check fails.
          comment-summary-in-pr: on-failure
